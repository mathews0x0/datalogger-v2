server {
    listen 80;
    server_name racesense.in www.racesense.in;

    # Serve the frontend UI files directly for maximum speed
    root /var/www/racesense/server/ui;
    index index.html;

    # Handle SPA routing (Vue/React/etc)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy all /api/ endpoints to the background Python server
    location /api/ {
        proxy_pass http://127.0.0.1:6969;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # We need longer timeouts for track processing
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
    }

    # Deny access to hidden files (e.g., .env, .git)
    location ~ /\. {
        deny all;
    }
}
