## RaceSense Nginx Configuration — HTTPS Ready
##
## Deployment steps:
## 1. Copy this file to /etc/nginx/sites-available/racesense
## 2. Symlink: ln -s /etc/nginx/sites-available/racesense /etc/nginx/sites-enabled/
## 3. Run: sudo certbot --nginx -d racesense.in -d www.racesense.in
##    (Certbot will auto-insert SSL certificate paths and redirect block)
## 4. Test: sudo nginx -t && sudo systemctl reload nginx
##
## After Certbot runs, the listen 443 block and ssl_certificate lines
## will be auto-injected. The port 80 block becomes a redirect.

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name racesense.in www.racesense.in;
    return 301 https://$host$request_uri;
}

# --- Main HTTPS server ---
server {
    listen 443 ssl;
    server_name racesense.in www.racesense.in;

    # SSL certificates (managed by Certbot — paths auto-filled)
    ssl_certificate /etc/letsencrypt/live/racesense.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/racesense.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Serve the frontend UI files directly
    root /var/www/racesense/server/ui;
    index index.html;

    # SPA routing — serve index.html for all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy /api/ to Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:6969;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for analysis processing
        proxy_read_timeout 120;
        proxy_connect_timeout 120;
        proxy_send_timeout 120;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }
}
