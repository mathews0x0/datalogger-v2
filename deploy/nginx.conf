map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    server_name racesense.in www.racesense.in;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Serve static UI files directly
    root /var/www/racesense/server/ui;
    index index.html;

    # Handle SPA routing (Vue/React/etc)
    location / {
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    # Proxy API requests to Gunicorn
    location /api/ {
        proxy_pass http://127.0.0.1:6969;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running analysis
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # Proxy upload endpoint (allow larger files from ESP32 — legacy monolithic upload)
    location = /api/upload {
        proxy_pass http://127.0.0.1:6969;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 50M;
        proxy_read_timeout 120s;
    }

    # Chunked upload endpoints (/api/upload/chunk, /api/upload/complete)
    location /api/upload/ {
        proxy_pass http://127.0.0.1:6969;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        client_max_body_size 1M;
        proxy_read_timeout 30s;
    }

    # Health check endpoint
    location /api/health {
        proxy_pass http://127.0.0.1:6969;
        access_log off;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/racesense.in/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/racesense.in/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}



server {
    if ($host = www.racesense.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = racesense.in) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name racesense.in www.racesense.in;
    return 404; # managed by Certbot




}